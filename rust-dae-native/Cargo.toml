[package]
name = "battery-design-dae-native"
version = "0.1.0"
description = "Optional native dense and sparse KLU SUNDIALS/IDA reference backends for battery-design DAE residuals"
authors = ["Morshed Varzandeh"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[features]
default = []
sundials-ida = []
sundials-ida-klu = ["sundials-ida"]

[dependencies]
battery-design-core = { path = "../rust-core" }

[profile.release]
panic = "unwind"

[[test]]
name = "dense_event_restart_campaign"
path = "tests/dense_event_restart_campaign.rs"
required-features = ["sundials-ida"]

[[test]]
name = "klu_feature_off"
path = "tests/klu_feature_off.rs"

[[test]]
name = "klu_event_restart_campaign"
path = "tests/klu_event_restart_campaign.rs"
required-features = ["sundials-ida-klu"]

[[test]]
name = "klu_backend_identity"
path = "tests/klu_backend_identity.rs"
required-features = ["sundials-ida-klu"]

[[test]]
name = "klu_solve_reference"
path = "tests/klu_solve_reference.rs"
required-features = ["sundials-ida-klu"]
