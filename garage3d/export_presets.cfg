html/head_include="<!-- The bridge, injected into the Godot shell's <head>.\n\n     The engine registers window.bdReceiveScene once it is up. This listener\n     exists from the first byte of the page, so a scene posted before the\n     engine is ready is QUEUED rather than dropped — otherwise the first\n     design a customer opens is the one that never appears, which is the\n     hardest kind of bug to see and the easiest to ship. -->\n<script>\n(function () {\n  'use strict';\n  var pending = null;\n  function deliver() {\n    if (pending == null || typeof window.bdReceiveScene !== 'function') return;\n    var payload = pending;\n    pending = null;\n    window.bdReceiveScene(payload);\n  }\n  window.addEventListener('message', function (e) {\n    var d = e.data;\n    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }\n    if (!d || d.type !== 'bd3d:scene') return;\n    pending = JSON.stringify(d.scene);\n    deliver();\n  });\n  // The engine cannot tell us it has installed the hook until it has, so the\n  // queue is drained on a short poll rather than a callback that would need\n  // the very hook we are waiting for.\n  var tries = 0;\n  var timer = setInterval(function () {\n    if (typeof window.bdReceiveScene === 'function') { deliver(); clearInterval(timer); }\n    else if (++tries > 600) clearInterval(timer);      // ~60 s, then stop burning a timer\n  }, 100);\n})();\n</script>\n<style>\n  /* The canvas is the whole frame: it is embedded in a pane that already has\n     its own chrome, so a second set of margins would just waste the space. */\n  html, body { margin: 0; padding: 0; overflow: hidden; background: #0e1512; }\n  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }\n</style>\n"
