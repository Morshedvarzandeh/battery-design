# release.yml — the downloads.
#
# Everything else in this repository is verified locally before it ships. This
# cannot be: a Windows installer has to be built on Windows and a .dmg on
# macOS, so the only honest place to build them is a matrix of real runners.
#
# It runs on a tag, or on a manual dispatch naming one. Either way it produces
# a DRAFT release with verified installers plus the compiled FMI artifact, and the draft is
# published by hand — a release is outward-facing and the last look should be a
# person's.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# On a tag push this is the tag. On a manual run github.ref_name would be the
# BRANCH — which would have quietly produced a release called "main" — so the
# dispatch input wins where it is given.
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GODOT_VERSION: "4.3"

jobs:
  # The same gates the ordinary CI runs. A release that skipped them
  # would be the one build nobody checked, which is exactly backwards.
  gates:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release_ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Verify the requested release ref
        id: release_ref
        env:
          REQUESTED_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" == v* ]] || { echo "::error::release ref must be a v* tag"; exit 1; }
          git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG" \
            || { echo "::error::tag does not exist: $REQUESTED_TAG"; exit 1; }
          release_sha=$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Verify CI accepted this exact release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          accepted=$(gh run list --repo "${{ github.repository }}" --workflow CI \
            --commit "$release_sha" --event push --limit 20 \
            --json conclusion,headSha,status \
            --jq 'any(.[]; .headSha == "'"$release_sha"'" and .status == "completed" and .conclusion == "success")')
          test "$accepted" = true || {
            echo "::error::CI has not accepted release commit $release_sha"
            exit 1
          }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.77.2
          targets: wasm32-unknown-unknown
      - run: node tools/validate.mjs
      - run: npm ci
      - run: npm run rust:test
      - run: npm run wasm:build
      - run: npm run typecheck
      - run: node --test tests/*.test.mjs
      - run: node tools/validate-vs-market.mjs
      - name: Cache Godot editor and web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-v1
      - name: Fetch Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          cp /tmp/tpl/templates/web_nothreads_release.zip \
             /tmp/tpl/templates/web_release.zip \
             "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import, exercise and export the Vessel Twin renderer
        run: |
          set -euo pipefail
          godot=$(find ~/godot -name 'Godot_v*_linux.x86_64' | head -1)
          chmod +x "$godot"
          cd garage3d
          mkdir -p build
          "$godot" --headless --import .
          timeout 60s "$godot" --headless --path . --script res://tests/vessel_payload_smoke.gd
          "$godot" --headless --export-release "Web" build/index.html
          test -s build/index.html
          test -s build/index.wasm
          test -s build/index.pck
      - name: Install the pinned real browser
        run: npx playwright install --with-deps chromium
      - name: Exercise the static and authenticated-runner browser paths
        run: npm run test:e2e
      - name: Preserve the verified renderer for desktop packaging
        uses: actions/upload-artifact@v4
        with:
          name: garage3d-web
          path: garage3d/build
          if-no-files-found: error
          retention-days: 1

  fmu:
    name: FMI 2.0 compiled artifact
    needs: gates
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/fmu.yml
    with:
      ref: ${{ needs.gates.outputs.release_sha }}

  # LINUX ONLY, deliberately.
  #
  # Windows and macOS installers can only be built on Windows and macOS
  # runners, and neither can be VERIFIED there — a green build is not a
  # working application, and nobody here can launch a .dmg to find out. The
  # first attempt shipped a matrix of four and all of them failed at once on a
  # missing icon; the fix was real, but confirming it on three platforms
  # nobody can test would be confirming a build, not a product.
  #
  # Linux is the one that can be installed and run here, so it is the one that
  # ships. The matrix is kept as a list of one so the other platforms are an
  # entry to add back rather than a rewrite.
  desktop:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gates.outputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      # Tauri on Linux needs the system webview and its build headers. The
      # webview belongs to the OS and is not shipped with the app, which is
      # what keeps the application itself around 4 MB. The download is ~48 MB
      # because the bundled Node runtime is 124 MB on its own — that is the
      # price of the customer not having to install a toolchain first.
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential curl wget file xdg-utils xvfb

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
          key: ${{ matrix.target }}

      # The sidecar IS the Node runtime, named with the target triple Tauri
      # expects. Bundling it is what removes the "install Node first" step
      # that half of any audience stops at.
      - name: Stage the Node runtime as the bundled runner
        shell: bash
        run: |
          mkdir -p desktop-app/src-tauri/binaries
          NODE_BIN="$(command -v node)"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$NODE_BIN" "desktop-app/src-tauri/binaries/bd-runner-${{ matrix.target }}.exe"
          else
            cp "$NODE_BIN" "desktop-app/src-tauri/binaries/bd-runner-${{ matrix.target }}"
            chmod +x "desktop-app/src-tauri/binaries/bd-runner-${{ matrix.target }}"
          fi
          ls -la desktop-app/src-tauri/binaries/

      - name: Build the shared Rust/Wasm calculation core
        run: |
          npm run wasm:build
      - name: Restore the Godot export accepted by the release gate
        uses: actions/download-artifact@v4
        with:
          name: garage3d-web
          path: garage3d/build
      - name: Stage and verify the complete application tree
        run: |
          node desktop-app/prepare.mjs
          npm run test:packaged

      # The icon set is committed, so there is nothing to generate here. It
      # used to be regenerated on every runner, which quietly papered over the
      # fact that .gitignore's blanket *.png rule had swallowed every icon —
      # the step failed on all three platforms at once and the real cause was
      # a repository that had never contained the files.
      - name: Check the icons the bundler needs are actually present
        shell: bash
        run: |
          cd desktop-app/src-tauri/icons
          for f in icon.ico icon.icns 32x32.png 128x128.png 128x128@2x.png; do
            [ -f "$f" ] || { echo "missing icon: $f"; exit 1; }
          done
          echo "icon set complete"

      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop-app/src-tauri
          args: --target ${{ matrix.target }}

      - name: Install and launch-smoke both Linux packages
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/deb -name '*.deb' -type f -print -quit)
          appimage=$(find desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/appimage -name '*.AppImage' -type f -print -quit)
          tools/smoke-installed-linux.sh "$deb" "$appimage"

      - name: Preserve only the installed and launch-smoked packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-linux-installers
          path: |
            desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  create-draft:
    needs: [desktop, fmu]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_NOTES: |
        Design a battery pack on your own machine. No account, no network, nothing uploaded.

        **Which file do I want?**

        | You are on | Download |
        |---|---|
        | Linux, Debian/Ubuntu | `.deb` |
        | Linux, anything else | `.AppImage` |
        | FMI 2.0 host on Linux/Windows x64 | `battery-design-ev.fmu` |

        Windows and macOS desktop installers are not published yet. Both platforms can use the browser app or run the designer from a clone.

        **FMI integration:** `battery-design-ev.fmu` contains compiled `linux64` and `win64` FMI 2.0 Co-Simulation binaries. CI ran schema, ABI, lifecycle and import-and-step checks with fmusim and FMPy on the matching operating systems. This is open-source interoperability evidence, not certification or an acceptance result from ANSYS Twin Builder, Simulink or GT-SUITE. Complete `docs/FMI_COMMERCIAL_ACCEPTANCE.md` before making a product-specific compatibility claim. The desktop GUI, CLI and local API still export an editable, source-only build kit.

        Verify the FMU with `battery-design-ev.fmu.sha256`. The desktop packages are unsigned, which some software centres will mention.
    steps:
      - name: Restore the exact compiled FMU accepted by its reusable gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: battery-design-ev-fmu
          path: release-assets/fmu
      - name: Restore only the installed and launch-smoked desktop packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-linux-installers
          path: release-assets/installers
      - name: Verify the immutable release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/fmu/battery-design-ev.fmu
          test -s release-assets/fmu/battery-design-ev.fmu.sha256
          (cd release-assets/fmu && sha256sum --check battery-design-ev.fmu.sha256)
          test "$(find release-assets/installers -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find release-assets/installers -type f -name '*.AppImage' | wc -l)" -eq 1
      - name: Create the draft only after every release artifact passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" = true
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" \
              --title "Battery pack designer $RELEASE_TAG" --notes "$RELEASE_NOTES" --draft
          else
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --verify-tag --draft \
              --title "Battery pack designer $RELEASE_TAG" --notes "$RELEASE_NOTES"
          fi
          mapfile -t previous_assets < <(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          for asset in "${previous_assets[@]}"; do
            gh release delete-asset "$RELEASE_TAG" "$asset" \
              --repo "${{ github.repository }}" --yes
          done
          mapfile -t assets < <(find release-assets -type f \( -name '*.deb' -o -name '*.AppImage' \
            -o -name 'battery-design-ev.fmu' -o -name 'battery-design-ev.fmu.sha256' \) | sort)
          test "${#assets[@]}" -eq 4
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "${{ github.repository }}" --clobber
          mapfile -t expected_names < <(
            for asset_path in "${assets[@]}"; do basename "$asset_path"; done | sort
          )
          mapfile -t published_names < <(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | sort)
          test "${#published_names[@]}" -eq 4
          test "$(printf '%s\n' "${expected_names[@]}")" = "$(printf '%s\n' "${published_names[@]}")"
