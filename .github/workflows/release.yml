# release.yml — the downloads.
#
# Everything else in this repository is verified locally before it ships. This
# cannot be: a Windows installer has to be built on Windows and a .dmg on
# macOS, so the only honest place to build them is a matrix of real runners.
#
# It runs on a tag, or on a manual dispatch naming one. Either way it produces
# a DRAFT release with an installer per platform plus the FMU, and the draft is
# published by hand — a release is outward-facing and the last look should be a
# person's.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

# On a tag push this is the tag. On a manual run github.ref_name would be the
# BRANCH — which would have quietly produced a release called "main" — so the
# dispatch input wins where it is given.
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The same three gates the ordinary CI runs. A release that skipped them
  # would be the one build nobody checked, which is exactly backwards.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tools/validate.mjs
      - run: node --test tests/*.test.mjs
      - run: node tools/validate-vs-market.mjs

  # The FMU is the artefact the battery market actually consumes — it drops
  # into Twin Builder, Simulink, GT-SUITE or Dymola as a component. It is
  # platform-independent source, so it is built once.
  fmu:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Export the co-simulation FMU
        run: |
          node desktop/bd.mjs fmu --app ev --energy 60000 --out ./fmu-ev
          cd fmu-ev && zip -r ../battery-design-ev.fmu.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: fmu
          path: battery-design-ev.fmu.zip

  # LINUX ONLY, deliberately.
  #
  # Windows and macOS installers can only be built on Windows and macOS
  # runners, and neither can be VERIFIED there — a green build is not a
  # working application, and nobody here can launch a .dmg to find out. The
  # first attempt shipped a matrix of four and all of them failed at once on a
  # missing icon; the fix was real, but confirming it on three platforms
  # nobody can test would be confirming a build, not a product.
  #
  # Linux is the one that can be installed and run here, so it is the one that
  # ships. The matrix is kept as a list of one so the other platforms are an
  # entry to add back rather than a rewrite.
  desktop:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tauri on Linux needs the system webview and its build headers. The
      # webview belongs to the OS and is not shipped with the app, which is
      # what keeps the application itself around 4 MB. The download is ~48 MB
      # because the bundled Node runtime is 124 MB on its own — that is the
      # price of the customer not having to install a toolchain first.
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential curl wget file

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
          key: ${{ matrix.target }}

      # The sidecar IS the Node runtime, named with the target triple Tauri
      # expects. Bundling it is what removes the "install Node first" step
      # that half of any audience stops at.
      - name: Stage the Node runtime as the bundled runner
        shell: bash
        run: |
          mkdir -p desktop-app/src-tauri/binaries
          NODE_BIN="$(command -v node)"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$NODE_BIN" "desktop-app/src-tauri/binaries/bd-runner-${{ matrix.target }}.exe"
          else
            cp "$NODE_BIN" "desktop-app/src-tauri/binaries/bd-runner-${{ matrix.target }}"
            chmod +x "desktop-app/src-tauri/binaries/bd-runner-${{ matrix.target }}"
          fi
          ls -la desktop-app/src-tauri/binaries/

      - name: Stage the application
        run: node desktop-app/prepare.mjs

      # The icon set is committed, so there is nothing to generate here. It
      # used to be regenerated on every runner, which quietly papered over the
      # fact that .gitignore's blanket *.png rule had swallowed every icon —
      # the step failed on all three platforms at once and the real cause was
      # a repository that had never contained the files.
      - name: Check the icons the bundler needs are actually present
        shell: bash
        run: |
          cd desktop-app/src-tauri/icons
          for f in icon.ico icon.icns 32x32.png 128x128.png 128x128@2x.png; do
            [ -f "$f" ] || { echo "missing icon: $f"; exit 1; }
          done
          echo "icon set complete"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-app/src-tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Battery pack designer ${{ env.RELEASE_TAG }}'
          releaseBody: |
            Design a battery pack on your own machine. No account, no network, nothing uploaded.

            **Which file do I want?**

            | You are on | Download |
            |---|---|
            | Linux, Debian/Ubuntu | `.deb` |
            | Linux, anything else | `.AppImage` |

            **Windows and macOS are not built yet.** They will be, but an
            installer nobody has launched is not a release — this one was
            installed and run before it was published. Until then, both
            platforms can run the designer in a browser at
            morshedvarzandeh.github.io/battery-design, or from a clone with
            `node desktop/bd.mjs serve`.

            **Already have a simulation toolchain?** Take `battery-design-ev.fmu.zip`
            instead. It is an FMI 2.0 co-simulation component: your vehicle or plant
            model drives it, and the pack answers with voltage, current, temperature
            and state of charge each coupling step. Works in ANSYS Twin Builder,
            Simulink, GT-SUITE and Dymola.

            The package is unsigned, which some software centres will mention.

            Nothing you enter leaves your machine.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  attach-fmu:
    needs: [desktop, fmu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: fmu }
      - name: Attach the FMU to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" battery-design-ev.fmu.zip \
            --repo "${{ github.repository }}" --clobber
