name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The integration gate: every cell, component and preset in the
      # database must satisfy the data contracts (validate), the whole
      # engine must pass its named test suites under Node's test runner,
      # and the result must still match production packs (validate-vs-market)
      # before a change can merge.
      - run: node tools/validate.mjs
      - run: node --test tests/*.test.mjs
      - run: node tools/validate-vs-market.mjs
