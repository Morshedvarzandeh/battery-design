name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.77.2
          targets: wasm32-unknown-unknown
      # The integration gate: every cell, component and preset in the
      # database, Rust/Wasm boundary, TypeScript contracts, runtime suites and
      # production-pack anchors must all agree before a change can merge.
      - run: node tools/validate.mjs
      - run: npm ci
      - run: npm run rust:test
      - run: npm run wasm:build
      - run: npm run typecheck
      - run: node --test tests/*.test.mjs
      - run: node tools/validate-vs-market.mjs

  # This is an independent native reference gate. It neither feeds the
  # browser/desktop packages nor advertises a shipped DAE capability.
  sundials-native-build:
    name: Pinned SUNDIALS IDA Linux build
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.77.2
      - name: Configure private native work roots
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/battery-design-native-dae-target"
            echo "DAE_SUNDIALS_ROOT=$RUNNER_TEMP/battery-design-sundials-ida-7.8.0"
          } >> "$GITHUB_ENV"
      - name: Record the native build toolchain
        run: |
          rustc --version --verbose
          cargo --version
          cmake --version
          cc --version
          tar --version
      - name: Download the exact locked source asset
        run: |
          set -euo pipefail
          node tools/verify-sundials-source.mjs --lock-only
          archive_url="$(node --input-type=module -e \
            'import { SUNDIALS_SOURCE_LOCK as lock } from "./tools/verify-sundials-source.mjs"; process.stdout.write(lock.sourceArchive.url);')"
          archive_size="$(node --input-type=module -e \
            'import { SUNDIALS_SOURCE_LOCK as lock } from "./tools/verify-sundials-source.mjs"; process.stdout.write(String(lock.sourceArchive.sizeBytes));')"
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --connect-timeout 20 --max-time 300 --max-filesize "$archive_size" \
            --retry 3 --retry-max-time 60 \
            --output "$RUNNER_TEMP/sundials-ida-source.tar.gz" \
            "$archive_url"
      - name: Verify, build, install and run the lifecycle probe
        run: |
          set -euo pipefail
          npm run dae:native:build -- \
            --archive "$RUNNER_TEMP/sundials-ida-source.tar.gz" \
            --output "$DAE_SUNDIALS_ROOT"
      - name: Prove the feature-off backend fails closed
        run: >-
          cargo test --locked --manifest-path rust-dae-native/Cargo.toml
          --no-default-features --test feature_off
      - name: Exercise every native DAE test in debug
        run: >-
          cargo test --locked --manifest-path rust-dae-native/Cargo.toml
          --no-default-features --features sundials-ida
      - name: Exercise every native DAE test in release
        run: >-
          cargo test --locked --release --manifest-path rust-dae-native/Cargo.toml
          --no-default-features --features sundials-ida
      - name: Attack the native build and provenance boundary
        run: >-
          npm run dae:native:test --
          --archive "$RUNNER_TEMP/sundials-ida-source.tar.gz"
          --root "$DAE_SUNDIALS_ROOT"

  # CI-only sparse reference gate. This root is not copied into browser,
  # desktop, package, or release outputs and makes no shipped-backend claim.
  sundials-klu-native-build:
    name: Pinned SUNDIALS IDA + SuiteSparse KLU Linux build
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.77.2
      - name: Configure the private CI-only native root
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/battery-design-native-dae-klu-target"
            echo "DAE_SUNDIALS_KLU_ROOT=$RUNNER_TEMP/battery-design-sundials-ida-klu"
            echo "SUNDIALS_IDA_KLU_ROOT=$RUNNER_TEMP/battery-design-sundials-ida-klu"
          } >> "$GITHUB_ENV"
      - name: Record the native sparse build toolchain
        run: |
          rustc --version --verbose
          cargo --version
          cmake --version
          cc --version
          c++ --version
          ar --version
          ld --version
          nm --version
          tar --version
      - name: Verify both closed source locks and download exact archives
        run: |
          set -euo pipefail
          npm run sundials:verify-source
          npm run suitesparse:verify-source
          sundials_url="$(node --input-type=module -e \
            'import { SUNDIALS_SOURCE_LOCK as lock } from "./tools/verify-sundials-source.mjs"; process.stdout.write(lock.sourceArchive.url);')"
          sundials_size="$(node --input-type=module -e \
            'import { SUNDIALS_SOURCE_LOCK as lock } from "./tools/verify-sundials-source.mjs"; process.stdout.write(String(lock.sourceArchive.sizeBytes));')"
          suitesparse_url="$(node --input-type=module -e \
            'import { SUITESPARSE_SOURCE_LOCK as lock } from "./tools/verify-suitesparse-source.mjs"; process.stdout.write(lock.sourceArchive.url);')"
          suitesparse_size="$(node --input-type=module -e \
            'import { SUITESPARSE_SOURCE_LOCK as lock } from "./tools/verify-suitesparse-source.mjs"; process.stdout.write(String(lock.sourceArchive.sizeBytes));')"
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --connect-timeout 20 --max-time 300 --max-filesize "$sundials_size" \
            --retry 3 --retry-max-time 60 \
            --output "$RUNNER_TEMP/sundials-ida-source.tar.gz" "$sundials_url"
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --connect-timeout 20 --max-time 900 --max-filesize "$suitesparse_size" \
            --retry 3 --retry-max-time 120 \
            --output "$RUNNER_TEMP/suitesparse-source.tar.gz" "$suitesparse_url"
      - name: Build privately, curate eight archives, and run the real sparse factor solve
        run: >-
          npm run dae:native:klu:build --
          --sundials-archive "$RUNNER_TEMP/sundials-ida-source.tar.gz"
          --suitesparse-archive "$RUNNER_TEMP/suitesparse-source.tar.gz"
          --output "$DAE_SUNDIALS_KLU_ROOT"
      - name: Run exactly 80 focused source, configuration, receipt and link cases
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/klu-build-contract-tests.tap"
          node --test --test-reporter=tap \
            tests/suitesparse-source-lock.test.mjs \
            tests/sundials-klu-native-build.test.mjs | tee "$log"
          grep -Fx '# tests 80' "$log"
          grep -Fx '# pass 80' "$log"
          grep -Fx '# fail 0' "$log"
      - name: Attack the KLU build, receipt, link and provenance boundary
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/klu-governed-attacks.log"
          npm run dae:native:klu:test -- \
            --sundials-archive "$RUNNER_TEMP/sundials-ida-source.tar.gz" \
            --suitesparse-archive "$RUNNER_TEMP/suitesparse-source.tar.gz" \
            --root "$DAE_SUNDIALS_KLU_ROOT" | tee "$log"
          grep -Fx 'SUNDIALS/IDA+KLU governed attack campaign passed: 28 attacks' "$log"
      - name: Prove the KLU backend fails closed without its feature
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/rust-dae-native-klu-feature-off.log"
          cargo test --locked --manifest-path rust-dae-native/Cargo.toml \
            --no-default-features --test klu_feature_off 2>&1 | tee "$log"
          test "$(grep -Ec '^test result: ok\. 4 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' "$log")" -eq 1
      - name: Exercise exactly 154 native dense and KLU cases in debug
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/rust-dae-native-klu-debug.log"
          cargo test --locked --manifest-path rust-dae-native/Cargo.toml \
            --no-default-features --features sundials-ida-klu 2>&1 | tee "$log"
          for expectation in '0 3' '2 1' '11 1' '19 1' '25 1' '97 1'; do
            read -r passed occurrences <<< "$expectation"
            actual="$(grep -Ec "^test result: ok\\. ${passed} passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;" "$log")"
            test "$actual" -eq "$occurrences"
          done
          test "$(grep -Ec '^test result: ok\.' "$log")" -eq 8
          test "$(awk '/^test result: ok\./ { total += $4 } END { print total + 0 }' "$log")" -eq 154
      - name: Exercise exactly 154 native dense and KLU cases in release
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/rust-dae-native-klu-release.log"
          cargo test --locked --release --manifest-path rust-dae-native/Cargo.toml \
            --no-default-features --features sundials-ida-klu 2>&1 | tee "$log"
          for expectation in '0 3' '2 1' '11 1' '19 1' '25 1' '97 1'; do
            read -r passed occurrences <<< "$expectation"
            actual="$(grep -Ec "^test result: ok\\. ${passed} passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;" "$log")"
            test "$actual" -eq "$occurrences"
          done
          test "$(grep -Ec '^test result: ok\.' "$log")" -eq 8
          test "$(awk '/^test result: ok\./ { total += $4 } END { print total + 0 }' "$log")" -eq 154

  fmu:
    name: FMI 2.0 compiled artifact
    needs: validate
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/fmu.yml
    with:
      ref: ${{ github.sha }}

  browser-e2e:
    needs: [validate, godot-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.77.2
          targets: wasm32-unknown-unknown
      - run: npm ci
      - name: Build the browser calculation core
        run: npm run wasm:build
      - name: Restore the Godot export accepted by its gate
        uses: actions/download-artifact@v4
        with:
          name: garage3d-web
          path: garage3d/build
      - name: Install the pinned real browser
        run: npx playwright install --with-deps chromium
      - name: Exercise the browser UI and accessibility tree
        run: npm run test:e2e
      - name: Keep browser evidence when the gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: tests/e2e/.artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Vessel Twin changes renderer-owned code as well as JavaScript payloads.
  # The Pages workflow already builds Godot after merge; doing the same on a
  # pull request prevents a GDScript/import/export defect reaching main first.
  godot-web:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot editor and web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-v1
      - name: Fetch Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          cp /tmp/tpl/templates/web_nothreads_release.zip \
             /tmp/tpl/templates/web_release.zip \
             "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import, exercise and export the Vessel Twin renderer
        run: |
          set -euo pipefail
          godot=$(find ~/godot -name 'Godot_v*_linux.x86_64' | head -1)
          chmod +x "$godot"
          cd garage3d
          mkdir -p build
          "$godot" --headless --import .
          timeout 60s "$godot" --headless --path . --script res://tests/vessel_payload_smoke.gd
          "$godot" --headless --export-release "Web" build/index.html
          test -s build/index.html
          test -s build/index.wasm
          test -s build/index.pck
      - name: Preserve the verified renderer for package testing
        uses: actions/upload-artifact@v4
        with:
          name: garage3d-web
          path: garage3d/build
          if-no-files-found: error
          retention-days: 1

  # Build what users install, then prove both Linux package formats launch the
  # authenticated runner from their installed resource tree. Pages waits for
  # the whole CI workflow, so a desktop packaging regression also blocks web
  # publication instead of being discovered at release-tag time.
  tauri-launch:
    needs: [validate, godot-web]
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,wasm32-unknown-unknown
      - name: Linux build and headless-launch dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential curl wget file xdg-utils xvfb
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
          key: ${{ env.TARGET }}
      - name: Stage the Node runtime as the bundled runner
        run: |
          mkdir -p desktop-app/src-tauri/binaries
          cp "$(command -v node)" "desktop-app/src-tauri/binaries/bd-runner-${TARGET}"
          chmod +x "desktop-app/src-tauri/binaries/bd-runner-${TARGET}"
      - name: Build the shared Rust/Wasm calculation core
        run: npm run wasm:build
      - name: Restore the Godot export accepted by its gate
        uses: actions/download-artifact@v4
        with:
          name: garage3d-web
          path: garage3d/build
      - name: Stage and verify the complete application tree
        run: |
          node desktop-app/prepare.mjs
          npm run test:packaged
      - name: Check the desktop icons
        run: |
          cd desktop-app/src-tauri/icons
          for file in icon.ico icon.icns 32x32.png 128x128.png 128x128@2x.png; do
            test -f "$file" || { echo "missing icon: $file"; exit 1; }
          done
      - name: Build the Linux installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-app/src-tauri
          args: --target ${{ env.TARGET }}
      - name: Install and launch-smoke the deb and AppImage
        run: |
          set -euo pipefail
          deb=$(find desktop-app/src-tauri/target/${TARGET}/release/bundle/deb -name '*.deb' -type f -print -quit)
          appimage=$(find desktop-app/src-tauri/target/${TARGET}/release/bundle/appimage -name '*.AppImage' -type f -print -quit)
          tools/smoke-installed-linux.sh "$deb" "$appimage"
